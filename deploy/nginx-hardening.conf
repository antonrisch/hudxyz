# Hudbox nginx hardening — drop into /etc/nginx/conf.d/ (http context, applies to every
# server block on the box). server_tokens + keepalive_timeout are singletons already set in
# the base nginx.conf, so they're omitted here. Reload after: sudo nginx -t && reload.

# security response headers (every response)
add_header Strict-Transport-Security "max-age=31536000" always;   # https-only for 1y
add_header X-Content-Type-Options "nosniff" always;               # no mime sniffing
add_header X-Frame-Options "DENY" always;                         # this host is never framed
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# slowloris mitigation: cap how long a client may take to send a request
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 15s;

# no large request bodies expected (static site + websocket upgrade)
client_max_body_size 1m;
