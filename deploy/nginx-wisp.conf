# Hudbox Wisp reverse proxy for kenobi.hudbox.dev.
#
# http context (e.g. /etc/nginx/conf.d/wisp-map.conf): the WebSocket upgrade map plus a
# per-ip connection cap. one wss per client, so the cap just bounds abuse.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
limit_conn_zone $binary_remote_addr zone=wisp_conn:10m;

# Add inside the TLS server { } block for kenobi.hudbox.dev (alongside `location /`):
location /wisp/ {
    limit_conn wisp_conn 16;            # max concurrent wisp sockets per ip
    proxy_pass http://127.0.0.1:4000;   # no trailing slash: keep the /wisp/ path
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;              # wisp sockets are long-lived
    proxy_send_timeout 1h;

    # lock the relay to Hudbox app origins (browsers always send Origin; non-browser
    # clients send none and get 403). allows hudbox.dev + subdomains and *.vercel.app previews.
    if ($http_origin !~* "^https://([a-z0-9-]+\.)*hudbox\.dev$|^https://([a-z0-9-]+\.)+vercel\.app$") {
        return 403;
    }
}
