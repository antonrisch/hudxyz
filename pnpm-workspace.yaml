packages:
  - "apps/*"
allowBuilds:
  # scramjet ships prebuilt dist; bufferutil is an optional ws speedup
  "@mercuryworkshop/scramjet": false
  "@sentry/cli": true
  bufferutil: false
  esbuild: false
  sharp: false
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1084.0'
  - '@aws-sdk/s3-request-presigner@3.1084.0'
