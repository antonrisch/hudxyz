name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter @hudxyz/web typecheck

      - name: Test
        run: pnpm --filter @hudxyz/web test

      - name: Build
        run: pnpm --filter @hudxyz/web build
        env:
          # Build-time placeholders — production secrets stay in Vercel.
          TURSO_CONNECTION_URL: file:./.ci.db
          TURSO_AUTH_TOKEN: ci-token
          R2_ACCOUNT_ID: 00000000000000000000000000000000
          R2_ACCESS_KEY_ID: ci-access-key
          R2_SECRET_ACCESS_KEY: ci-secret-key
          R2_BUCKET: hudxyz-app-assets-ci
          R2_PUBLIC_BASE_URL: https://assets.example.com
          REVIEW_SECRET: ci-review-secret-ci-review-secret
          SUBMIT_SESSION_SECRET: ci-submit-session-secret-ci-submit
          NEXT_PUBLIC_WISP_URL: ws://localhost:4000/wisp/
          NEXT_PUBLIC_SITE_URL: https://hudxyz.com
